<text x="-290" y="10" font-size="20" fill="#f85149" text-anchor="middle">✗ FAILED<animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/></text>
<text x="-290" y="10" font-size="20" fill="#3fb950" text-anchor="middle" opacity="0">✓ GREEN<animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;0.75;1" dur="6s" repeatCount="indefinite"/></text>
</g>
<g opacity="0">
