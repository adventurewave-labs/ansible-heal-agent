<text x="600" y="198" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="0.4" fill="#a8b3c4">Agent that reads Ansible failures, patches playbook/inventory/vars,</text>
<text x="600" y="224" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="0.4" fill="#a8b3c4">commits, and re-runs the pipeline.</text>

<g transform="translate(600,308)">

<g font-family="ui-monospace,Menlo,Consolas,monospace">
<rect x="-420" y="-56" width="260" height="112" rx="12" fill="#0d1117" stroke="#3a4250" stroke-width="2"/>
