name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.11
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure a git identity for the scratch-repo fixtures
        run: |
          git config --global user.email "ci@ansible-heal.invalid"
          git config --global user.name "CI"
      - name: Run suite with coverage gate
        run: |
          python -m pytest -q \
            --cov=agent --cov=pipeline --cov=scenarios \
            --cov-report=term-missing --cov-fail-under=78
      - name: Assert the suite did not dirty the checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test suite mutated the working tree"
            git status --porcelain
            exit 1
          fi

  demo:
    name: end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config --global user.email "ci@ansible-heal.invalid"
          git config --global user.name "CI"
      - name: make demo must converge to green
        run: make demo
      - name: Publish the transcript the run produced
        uses: actions/upload-artifact@v4
        with:
          name: demo-transcript
          path: .demo-workspace/transcripts/*.md
          if-no-files-found: error
