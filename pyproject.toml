# Project metadata
[project]
name = "ansible-heal-agent"
version = "0.1.0"
description = "Autonomous agent that scans Ansible logs, diagnoses failures, patches playbooks, commits, and re-runs the pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marcus Patman" }]
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    # agent.yaml_edit does round-trip edits; without this the patcher
    # cannot preserve comments, key order or indentation.
    "ruamel.yaml>=0.18",
    # A hard runtime dependency, not a test one. Every check that stops the
    # agent damaging a working repository — does this host exist, does this
    # module resolve — is answered by ansible-core, and without it they all
    # return "unknown". `pip install ansible-heal-agent` used to produce an
    # install whose safety guards were all inert.
    "ansible-core>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ansible-heal = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "pipeline*", "scenarios*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
omit = ["tests/*"]
