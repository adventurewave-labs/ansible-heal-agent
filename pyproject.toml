# Project metadata
[project]
name = "ansible-heal-agent"
version = "0.1.0"
description = "Autonomous agent that scans Ansible logs, diagnoses failures, patches playbooks, commits, and re-runs the pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Platform Reliability Team" }]
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ansible-heal = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "pipeline*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
